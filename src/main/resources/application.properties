# ==========================================
# SERVER
# ==========================================
server.port=8080

# ==========================================
# DATABASE (MySQL)
# Uses environment variables with local fallback
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/TMA?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT
# In production, JWT_SECRET must be set as an environment variable.
# ==========================================
jwt.secret=${JWT_SECRET:ChangeThisToAVeryLongRandomSecretKeyAtLeast32CharactersLong123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# SWAGGER / OPENAPI
# Set SWAGGER_ENABLED=false in production.
# ==========================================
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}