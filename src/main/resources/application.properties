spring.application.name=TaskManagerApplication


# =========================
# MySQL Database Configuration
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/TMA?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# =========================
# Hibernate / JPA Configuration
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


#jwt.secret=some-very-long-random-string-at-least-32-chars
jwt.secret=ChangeThisToAVeryLongRandomSecretKeyAtLeast32CharactersLong123456
jwt.expiration=86400000

# Swagger / OpenAPI
# =========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs